packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - msgpackr-extract
  - esbuild
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
  - unrs-resolver

allowBuilds:
  msgpackr-extract: true
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  unrs-resolver: true
